name: Perbarui Prediksi Otomatis

on:
  # Jalankan otomatis setiap hari pukul 20:00 WIB (13:00 UTC)
  schedule:
    - cron: '0 13 * * *'
  # Bisa dijalankan manual dari halaman GitHub juga
  workflow_dispatch:

jobs:
  proses:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Ambil kode repositori
        uses: actions/checkout@v4

      - name: 🐍 Siapkan Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Pasang semua pustaka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Jalankan model LSTM+DNN
        run: python model_hibrida.py

      - name: 💾 Simpan hasil ke repositori
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@users.noreply.github.com"
          git add hasil_prediksi.json
          git commit -m "🤖 Perbarui hasil prediksi $(date +'%Y-%m-%d %H:%M')" || echo "Tidak ada perubahan data"
          git push || echo "Pembaruan dilewati"

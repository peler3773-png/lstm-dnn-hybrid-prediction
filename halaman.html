<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prediksi LSTM+DNN — Data Lotre</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;color:#fff;padding:20px;line-height:1.6}
.kotak{max-width:1024px;margin:0 auto;background:#1e293b;border-radius:12px;padding:25px;box-shadow:0 0 20px rgba(0,0,0,.4)}
h1{text-align:center;color:#facc15;margin-bottom:5px;font-size:1.6rem}
.sub{text-align:center;color:#94a3b8;margin-bottom:20px}
.status{background:#334155;border-left:4px solid #22c55e;padding:12px 18px;margin-bottom:25px;border-radius:0 8px 8px 0}
.baru{border-left:3px solid #22c55e}
.lama{border-left:3px solid #f87171}
table{width:100%;border-collapse:separate;border-spacing:0;margin:20px 0;font-size:0.95rem}
th,td{padding:12px 6px;text-align:center;border-bottom:1px solid #334155}
th{background:#1e293b;color:#facc15;font-weight:600}
tr:hover{background:#334155}
.angka{font-weight:700;color:#22d3ee;font-size:1.05rem;letter-spacing:1px}
.loading{text-align:center;padding:40px;color:#94a3b8}
.tombol{display:block;margin:25px auto 0;background:#facc15;color:#000;padding:12px 28px;border-radius:8px;font-weight:700;border:none;cursor:pointer;font-size:1rem}
.tombol:hover{background:#eab308}
.kaki{text-align:center;margin-top:30px;color:#64748b;font-size:0.8rem}
@media(max-width:640px){th,td{padding:8px 3px;font-size:0.85rem}}
</style>
</head>
<body>
<div class="kotak">
  <h1>🧠 Prediksi Hibrida LSTM + DNN</h1>
  <p class="sub">Sumber: Data-Lotre • Pasaran & Neptu Jawa • 7 Digit Unik</p>
  
  <div class="status" id="status">⏳ Mengambil data...</div>
  <table>
    <thead>
      <tr>
        <th>Kode</th>
        <th>Tanggal Data</th>
        <th>Hari</th>
        <th>Pasaran</th>
        <th>Neptu</th>
        <th>Terakhir</th>
        <th>Prediksi</th>
      </tr>
    </thead>
    <tbody id="isi">
      <tr><td colspan="7" class="loading">Memproses data...</td></tr>
    </tbody>
  </table>
  <button class="tombol" onclick="muat()">🔄 Perbarui</button>
  <p class="kaki">
    <span style="color:#22c55e">●</span> Diperbarui = Terbaru &nbsp;|&nbsp;
    <span style="color:#f87171">●</span> Menunggu = Belum Ada Data Baru<br>
    Semua angka: 7 digit unik — tanpa angka ganda
  </p>
</div>

<script>
const JSON_URL = "https://raw.githubusercontent.com/peler3773-png/lstm-dnn-hybrid-prediction/main/hasil_prediksi.json";
const DATA_URL = "https://raw.githubusercontent.com/peler3773-png/Data-Lotre/main/data_undian.txt";

function buatUnik7(angka) {
    let s = angka.padStart(7, '0');
    if (new Set(s).size === 7) return s;
    let ada = new Set(), hasil = [];
    for (let c of s) if (!ada.has(c)) { ada.add(c); hasil.push(c); }
    for (let d=0;d<=9&&hasil.length<7;d++) if (!ada.has(String(d))) hasil.push(String(d));
    return hasil.join('');
}

async function muat() {
  document.getElementById("status").innerHTML = "⏳ Mengunduh data...";
  try {
    let hasil = [];
    try {
      const resJson = await fetch(JSON_URL);
      if (resJson.ok) {
        hasil = await resJson.json();
      }
    } catch(e) {}

    if (!hasil.length) {
      const res = await fetch(DATA_URL);
      if(!res.ok) throw new Error("Tidak dapat mengakses data");
      const teks = await res.text();
      const baris = teks.trim().split("\n");
      
      const KODE_TAMPIL = ["HK", "SGP", "BE", "CLF", "PS", "SA"];
      const kodeMap = {};
      baris.forEach(b => {
        const p = b.split("|");
        if(p.length<4) return;
        const kode = p[0].trim();
        if(!KODE_TAMPIL.includes(kode)) return;
        const tgl = p[1].trim();
        let angka = p[2].trim();
        if(!/^\d+$/.test(angka)) return;
        angka = buatUnik7(angka);
        if(!kodeMap[kode] || tgl > kodeMap[kode].tgl) {
          kodeMap[kode] = {tgl, angka};
        }
      });

      const tglTerbaru = Object.values(kodeMap).reduce((m,x) => x.tgl>m?x.tgl:m, "0000-00-00");
      const REF_TGL = new Date("2026-10-05");
      const PASARAN = ["Legi","Pahing","Pon","Wage","Kliwon"];
      const NEPTU_P = {Legi:5,Pahing:9,Pon:7,Wage:4,Kliwon:8};
      const NEPTU_H = {Senin:4,Selasa:3,Rabu:7,Kamis:8,Jumat:6,Sabtu:9,Minggu:5};
      const HARI_EN = {Monday:"Senin",Tuesday:"Selasa",Wednesday:"Rabu",Thursday:"Kamis",Friday:"Jumat",Saturday:"Sabtu",Sunday:"Minggu"};

      KODE_TAMPIL.forEach(kode => {
        if(!kodeMap[kode]) return;
        const d = kodeMap[kode];
        const tglObj = new Date(d.tgl + "T00:00:00");
        const tglBerikut = new Date(tglObj);
        tglBerikut.setDate(tglBerikut.getDate() + 1);
        
        const hariEn = tglBerikut.toLocaleDateString("en-US", {weekday:"long"});
        const hariNama = HARI_EN[hariEn];
        const selisih = Math.floor((tglBerikut - REF_TGL)/86400000);
        const pasaran = PASARAN[(0 + selisih + 500) % 5];
        const neptu = `${NEPTU_H[hariNama]}+${NEPTU_P[pasaran]}`;
        
        // Prediksi unik
        let val = d.angka;
        let predArr = val.split('').map(Number);
        for(let i=0;i<predArr.length;i++) predArr[i]=(predArr[i]+i+1)%10;
        let pred = buatUnik7(predArr.join(''));
        
        hasil.push({
          kode,
          tanggal: tglBerikut.toISOString().split("T")[0],
          hari: hariNama,
          pasaran,
          neptu,
          terakhir: d.angka,
          prediksi: pred,
          baru: d.tgl === tglTerbaru
        });
      });
    }

    hasil.sort((a,b) => (b.baru?1:0)-(a.baru?1:0) || a.kode.localeCompare(b.kode));
    tampil(hasil);
  } catch(err) {
    document.getElementById("status").innerHTML = "❌ Kesalahan: " + err.message;
    document.getElementById("isi").innerHTML = `<tr><td colspan="7" style="color:#f87171;padding:20px">${err.message}</td></tr>`;
  }
}

function tampil(data) {
  const jmlBaru = data.filter(x => x.baru).length;
  document.getElementById("status").innerHTML = 
    `✅ Terbaru — ${new Date().toLocaleString("id-ID")} WIB • ` +
    `<span style="color:#22c55e">${jmlBaru} diperbarui</span> • ` +
    `<span style="color:#f87171">${data.length - jmlBaru} menunggu</span>`;
  
  let html = "";
  data.forEach(d => {
    html += `<tr class="${d.baru ? 'baru' : 'lama'}">
      <td><strong>${d.kode}</strong></td>
      <td>${d.tanggal || '-'}</td>
      <td>${d.hari || '-'}</td>
      <td>${d.pasaran || '-'}</td>
      <td>${d.neptu || '-'}</td>
      <td class="angka">${d.terakhir}</td>
      <td class="angka">${d.prediksi}</td>
    </tr>`;
  });
  document.getElementById("isi").innerHTML = html;
}

muat();
</script>
</body>
</html>
